<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Rota OSRM - Corridas e Deslocamentos Intermediários</title>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }
    body {
      display: flex;
      height: 100vh;
      background-color: #0f172a;
      color: #f8fafc;
      overflow: hidden;
    }
    /* Sidebar */
    .sidebar {
      width: 420px;
      background-color: #1e293b;
      border-right: 1px solid #334155;
      display: flex;
      flex-direction: column;
      z-index: 1000;
      box-shadow: 4px 0 24px rgba(0, 0, 0, 0.4);
    }
    .sidebar-header {
      padding: 20px;
      background-color: #0f172a;
      border-bottom: 1px solid #334155;
    }
    .sidebar-header h1 {
      font-size: 1.15rem;
      font-weight: 800;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sidebar-header p {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-top: 4px;
      line-height: 1.3;
    }

    /* Filters & Controls */
    .controls {
      padding: 16px 20px;
      background-color: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .filter-tabs {
      display: flex;
      gap: 4px;
      background-color: #0f172a;
      padding: 4px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .tab-btn {
      flex: 1;
      padding: 6px 8px;
      font-size: 0.7rem;
      font-weight: 700;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: #94a3b8;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background-color: #0284c7;
      color: #ffffff;
    }
    label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
    }
    select {
      width: 100%;
      padding: 10px 12px;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f1f5f9;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    select:focus {
      border-color: #38bdf8;
    }
    .nav-buttons {
      display: flex;
      gap: 8px;
    }
    .btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-primary {
      background-color: #0284c7;
      color: white;
    }
    .btn-primary:hover {
      background-color: #0369a1;
    }
    .btn-secondary {
      background-color: #334155;
      color: #f1f5f9;
    }
    .btn-secondary:hover {
      background-color: #475569;
    }

    /* Details Container */
    .segment-details {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .card {
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
    }
    .app-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
    }
    .badge-uber { background-color: #000000; color: #ffffff; border: 1px solid #334155; }
    .badge-99 { background-color: #ff8800; color: #ffffff; }
    .badge-deslocamento { background-color: #d97706; color: #ffffff; }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #1e293b;
    }
    .info-item {
      display: flex;
      flex-direction: column;
    }
    .info-label {
      font-size: 0.7rem;
      color: #64748b;
      font-weight: 600;
    }
    .info-value {
      font-size: 0.88rem;
      font-weight: 700;
      color: #f8fafc;
      margin-top: 2px;
    }

    /* Route Timeline Nodes */
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 12px;
    }
    .timeline-node {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .node-icon {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-top: 4px;
      flex-shrink: 0;
    }
    .node-origin { background-color: #10b981; box-shadow: 0 0 8px rgba(16, 185, 129, 0.5); }
    .node-dest { background-color: #ef4444; box-shadow: 0 0 8px rgba(239, 68, 68, 0.5); }
    .node-desloc-orig { background-color: #f59e0b; box-shadow: 0 0 8px rgba(245, 158, 11, 0.5); }
    .node-desloc-dest { background-color: #8b5cf6; box-shadow: 0 0 8px rgba(139, 92, 246, 0.5); }

    .node-content {
      display: flex;
      flex-direction: column;
    }
    .node-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: #f1f5f9;
    }
    .node-sub {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    /* Map Container */
    #map {
      flex: 1;
      height: 100%;
      background-color: #090d16;
    }

    /* Status Bar */
    .status-bar {
      padding: 10px 14px;
      background-color: #0f172a;
      border-top: 1px solid #334155;
      font-size: 0.75rem;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
    }
    .status-active { color: #10b981; font-weight: 700; }
    .status-warning { color: #f59e0b; font-weight: 700; }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h1>🚗 OSRM Real-Time Route Inspector</h1>
      <p>Alternância entre Corridas e Deslocamentos Intermediários (Batendo Lata)</p>
    </div>

    <div class="controls">
      <label>Filtrar Visualização</label>
      <div class="filter-tabs">
        <button class="tab-btn active" onclick="setFilter('todos', this)">Todos (<span id="countTodos">0</span>)</button>
        <button class="tab-btn" onclick="setFilter('CORRIDA', this)">Corridas (<span id="countCorridas">0</span>)</button>
        <button class="tab-btn" onclick="setFilter('DESLOCAMENTO', this)">Deslocamentos (<span id="countDeslocamentos">0</span>)</button>
      </div>

      <label for="segSelect">Selecionar Trecho do Dia</label>
      <select id="segSelect" onchange="loadSelectedSegment()"></select>

      <div class="nav-buttons">
        <button class="btn btn-secondary" onclick="prevSegment()">◀ Anterior</button>
        <button class="btn btn-primary" onclick="nextSegment()">Próximo ▶</button>
      </div>
    </div>

    <div class="segment-details" id="segmentDetails">
      <!-- Injetado dinamicamente -->
    </div>

    <div class="status-bar">
      <span>Status OSRM: <span id="osrmStatus" class="status-active">Pronto</span></span>
      <span id="routePointsCount">0 vértices de asfalto</span>
    </div>
  </div>

  <!-- Leaflet Map -->
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Dados das corridas e deslocamentos -->
  <script src="./data.js"></script>

  <script>
    let map;
    let dataset = { corridas: [], segmentos: [] };
    let filteredSegments = [];
    let currentFilteredIndex = 0;
    let currentFilterType = 'todos';

    let currentPolyline = null;
    let originMarker = null;
    let destMarker = null;

    function initMap() {
      map = L.map('map').setView([-18.7144, -39.8542], 13);

      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/">CARTO</a>',
        maxZoom: 19
      }).addTo(map);
    }

    async function loadDataset() {
      try {
        if (window.DATASET && window.DATASET.segmentos) {
          dataset = window.DATASET;
        } else {
          const res = await fetch('./corridas_sequenciais.json');
          dataset = await res.json();
        }

        document.getElementById('countTodos').textContent = dataset.segmentos.length;
        document.getElementById('countCorridas').textContent = dataset.corridas.length;
        document.getElementById('countDeslocamentos').textContent = dataset.segmentos.filter(s => s.tipo === 'DESLOCAMENTO').length;

        applyFilter();
      } catch (err) {
        console.error("Erro ao carregar dataset", err);
        document.getElementById('segmentDetails').innerHTML = `<div class="card" style="color:#ef4444;">Erro ao carregar dados. Verifique corridas_sequenciais.json / data.js</div>`;
      }
    }

    function setFilter(type, btnEl) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btnEl.classList.add('active');
      currentFilterType = type;
      applyFilter();
    }

    function applyFilter() {
      if (currentFilterType === 'todos') {
        filteredSegments = dataset.segmentos;
      } else {
        filteredSegments = dataset.segmentos.filter(s => s.tipo === currentFilterType);
      }

      currentFilteredIndex = 0;
      populateSelect();
      loadSelectedSegment();
    }

    function populateSelect() {
      const select = document.getElementById('segSelect');
      select.innerHTML = '';
      filteredSegments.forEach((seg, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        const tag = seg.tipo === 'CORRIDA' ? `🟢 [${seg.app}]` : `🟡 [DESLOCAMENTO]`;
        opt.textContent = `${tag} ${seg.horario_inicio} ➔ ${seg.horario_fim} (${seg.origem.bairro} ➔ ${seg.destino.bairro})`;
        select.appendChild(opt);
      });
    }

    function prevSegment() {
      if (currentFilteredIndex > 0) {
        currentFilteredIndex--;
        document.getElementById('segSelect').value = currentFilteredIndex;
        loadSelectedSegment();
      }
    }

    function nextSegment() {
      if (currentFilteredIndex < filteredSegments.length - 1) {
        currentFilteredIndex++;
        document.getElementById('segSelect').value = currentFilteredIndex;
        loadSelectedSegment();
      }
    }

    async function loadSelectedSegment() {
      currentFilteredIndex = parseInt(document.getElementById('segSelect').value) || 0;
      const seg = filteredSegments[currentFilteredIndex];
      if (!seg) return;

      renderSegmentCard(seg);
      await fetchAndDrawOSRMRoute(seg);
    }

    function renderSegmentCard(seg) {
      const detailsContainer = document.getElementById('segmentDetails');
      const isCorrida = seg.tipo === 'CORRIDA';
      
      let badgeClass = 'badge-deslocamento';
      if (isCorrida) {
        badgeClass = seg.app.toLowerCase() === 'uber' ? 'badge-uber' : 'badge-99';
      }

      const valorFormatted = isCorrida ? `R$ ${seg['valor_r$'].toFixed(2).replace('.', ',')}` : 'R$ 0,00 (Batendo Lata)';

      detailsContainer.innerHTML = `
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span class="app-badge ${badgeClass}">${seg.titulo}</span>
            <span style="font-size:1.05rem; font-weight:800; color:${isCorrida ? '#38bdf8' : '#f59e0b'};">${valorFormatted}</span>
          </div>

          <div class="info-row">
            <div class="info-item">
              <span class="info-label">Horário</span>
              <span class="info-value">${seg.horario_inicio} - ${seg.horario_fim}</span>
            </div>
            <div class="info-item">
              <span class="info-label">Duração</span>
              <span class="info-value">${seg.duracao}</span>
            </div>
            <div class="info-item">
              <span class="info-label">Tipo</span>
              <span class="info-value">${isCorrida ? 'Produtivo' : 'Improdutivo / Vazio'}</span>
            </div>
          </div>
        </div>

        <div class="card">
          <span class="info-label">Ponto de Partida e Chegada</span>
          <div class="timeline">
            <div class="timeline-node">
              <div class="node-icon ${isCorrida ? 'node-origin' : 'node-desloc-orig'}"></div>
              <div class="node-content">
                <span class="node-title">${seg.origem.rua} (${seg.origem.bairro})</span>
                <span class="node-sub">Lat: ${seg.origem.lat}, Lon: ${seg.origem.lon}</span>
              </div>
            </div>
            <div class="timeline-node">
              <div class="node-icon ${isCorrida ? 'node-dest' : 'node-desloc-dest'}"></div>
              <div class="node-content">
                <span class="node-title">${seg.destino.rua} (${seg.destino.bairro})</span>
                <span class="node-sub">Lat: ${seg.destino.lat}, Lon: ${seg.destino.lon}</span>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    async function fetchAndDrawOSRMRoute(seg) {
      const orig = seg.origem;
      const dest = seg.destino;
      const isCorrida = seg.tipo === 'CORRIDA';

      const statusEl = document.getElementById('osrmStatus');
      const countEl = document.getElementById('routePointsCount');

      statusEl.textContent = "Buscando OSRM...";
      statusEl.className = "status-active";

      // URLs OSRM (Via Nginx SSL proxy, IP direto ou OSRM Publico)
      const osrmEndpoints = [
        `/osrm/route/v1/driving/${orig.lon},${orig.lat};${dest.lon},${dest.lat}?geometries=geojson&overview=full`,
        `http://2.24.121.189:5000/route/v1/driving/${orig.lon},${orig.lat};${dest.lon},${dest.lat}?geometries=geojson&overview=full`,
        `https://router.project-osrm.org/route/v1/driving/${orig.lon},${orig.lat};${dest.lon},${dest.lat}?geometries=geojson&overview=full`
      ];

      let coords = [];
      let distanceKm = 0;
      let osrmSuccess = false;

      for (let url of osrmEndpoints) {
        try {
          const res = await fetch(url).catch(() => null);
          if (res && res.ok) {
            const data = await res.json();
            if (data.code === 'Ok' && data.routes.length > 0) {
              coords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
              distanceKm = (data.routes[0].distance / 1000).toFixed(2);
              osrmSuccess = true;
              break;
            }
          }
        } catch (e) {
          // tentar proximo endpoint
        }
      }

      if (osrmSuccess) {
        statusEl.textContent = "OSRM Conectado (Malha Rodoviária ES)";
        statusEl.className = "status-active";
      } else {
        coords = [[orig.lat, orig.lon], [dest.lat, dest.lon]];
        statusEl.textContent = "Fallback Reta";
        statusEl.className = "status-warning";
      }

      countEl.textContent = `${coords.length} vértices OSRM (${distanceKm > 0 ? distanceKm + ' km' : ''})`;

      // Limpar elementos anteriores
      if (currentPolyline) map.removeLayer(currentPolyline);
      if (originMarker) map.removeLayer(originMarker);
      if (destMarker) map.removeLayer(destMarker);

      // Estilo da linha: Azul para Corrida / Laranja Ambar para Deslocamento
      const strokeColor = isCorrida ? '#0284c7' : '#f59e0b';
      const dashArray = isCorrida ? null : '8, 6';

      currentPolyline = L.polyline(coords, {
        color: strokeColor,
        weight: 6,
        opacity: 0.9,
        dashArray: dashArray,
        lineCap: 'round',
        lineJoin: 'round'
      }).addTo(map);

      // Pins Origem / Destino
      const origColor = isCorrida ? '#10b981' : '#f59e0b';
      const destColor = isCorrida ? '#ef4444' : '#8b5cf6';

      originMarker = L.circleMarker([orig.lat, orig.lon], {
        radius: 8,
        fillColor: origColor,
        color: '#ffffff',
        weight: 3,
        fillOpacity: 1
      }).addTo(map).bindPopup(`<b>Ponto Inicial:</b> ${orig.rua}, ${orig.bairro}`);

      destMarker = L.circleMarker([dest.lat, dest.lon], {
        radius: 8,
        fillColor: destColor,
        color: '#ffffff',
        weight: 3,
        fillOpacity: 1
      }).addTo(map).bindPopup(`<b>Ponto Final:</b> ${dest.rua}, ${dest.bairro}`);

      map.fitBounds(currentPolyline.getBounds(), { padding: [50, 50] });
    }

    window.onload = () => {
      initMap();
      loadDataset();
    };
  </script>
</body>
</html>

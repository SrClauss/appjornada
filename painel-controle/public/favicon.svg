<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Neon Emblem Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Glow Effect Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="8"/>

  <!-- Steering Wheel & Location Pin Group -->
  <g filter="url(#glow)" stroke="url(#neonGrad)" stroke-width="24" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Steering Wheel Ring -->
    <circle cx="256" cy="256" r="160" />

    <!-- Center Hub Ring -->
    <circle cx="256" cy="256" r="36" fill="url(#neonGrad)" />

    <!-- Steering Spokes -->
    <path d="M 120 236 L 220 248" />
    <path d="M 392 236 L 292 248" />
    <path d="M 236 290 L 210 390" />
    <path d="M 276 290 L 302 390" />

    <!-- Integrated Location Pin Top -->
    <path d="M 256 96 C 220 96 192 124 192 160 C 192 200 256 256 256 256 C 256 256 320 200 320 160 C 320 124 292 96 256 96 Z" fill="url(#neonGrad)" stroke="none"/>
    <circle cx="256" cy="156" r="20" fill="#0F172A" stroke="none" />
  </g>
</svg>

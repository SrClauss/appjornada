services:

  nginx:
    image: nginx:alpine
    container_name: app_jornada_nginx
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - painel
      - backend

  painel:
    build:
      context: ./painel-controle
      args:
        VITE_API_URL: /api
    container_name: app_jornada_painel
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: app_jornada_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      MONGO_URL: mongodb://mongo:27017/appjornada
      MINIO_ENDPOINT: minio:9000
    depends_on:
      - mongo
      - minio

  mongo:
    image: mongo:7
    container_name: app_jornada_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  minio:
    image: minio/minio:latest
    container_name: app_jornada_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  minio_data:
  mongo_data:

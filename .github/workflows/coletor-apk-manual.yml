name: Gerar APK do Coletor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coletor/flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Instalar dependências
        run: flutter pub get

      - name: Gerar APK release
        run: |
          set +e
          flutter clean
          flutter build apk --release --verbose
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            echo "flutter build retornou código $status; verificando se o APK foi gerado..."
            if { [ -d build/app/outputs ] && find build/app/outputs -type f -name "*.apk" | grep -q .; } || { [ -d android/app/build/outputs ] && find android/app/build/outputs -type f -name "*.apk" | grep -q .; }; then
              echo "APK encontrado mesmo com retorno de erro do flutter; continuando."
            else
              exit "$status"
            fi
          fi

      - name: Publicar artefato APK
        uses: actions/upload-artifact@v4
        with:
          name: appjornada-coletor-apk
          path: |
            coletor/flutter/build/app/outputs/flutter-apk/*.apk
            coletor/flutter/build/app/outputs/apk/release/*.apk
            coletor/flutter/android/app/build/outputs/apk/release/*.apk
